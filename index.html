<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dreamcast — sovne til podcaster</title>
<style>
  :root {
    --bg-0: #0a0a1a;
    --bg-1: #14142b;
    --bg-2: #1f1f3d;
    --bg-3: #2a2a52;
    --fg-0: #f0f0ff;
    --fg-1: #a8a8c8;
    --fg-2: #6c6c8a;
    --accent: #8a7dff;
    --accent-2: #c4a7ff;
    --good: #6fd6a8;
    --warn: #ffb380;
    --danger: #ff8a9a;
    --radius: 14px;
    --shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, #1a1a3a 0%, #0a0a1a 70%) fixed;
    color: var(--fg-0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  body { padding-bottom: 220px; }
  .app { max-width: 980px; margin: 0 auto; padding: 24px 20px 40px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: -0.3px;
  }
  .logo .moon { font-size: 26px; }
  nav.tabs { display: flex; gap: 6px; background: var(--bg-1); padding: 4px; border-radius: 999px; }
  nav.tabs button {
    background: transparent; border: none; color: var(--fg-1);
    padding: 8px 18px; border-radius: 999px; cursor: pointer; font-size: 14px;
    transition: background 0.15s, color 0.15s;
  }
  nav.tabs button:hover { color: var(--fg-0); }
  nav.tabs button.active { background: var(--accent); color: white; }

  .view { display: none; }
  .view.active { display: block; }

  .search-box {
    display: flex; gap: 8px; margin-bottom: 22px;
  }
  .search-box input {
    flex: 1; background: var(--bg-1); border: 1px solid var(--bg-3);
    color: var(--fg-0); padding: 12px 16px; border-radius: var(--radius);
    font-size: 15px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent); color: white; border: none;
    padding: 10px 18px; border-radius: var(--radius); cursor: pointer;
    font-size: 14px; font-weight: 500; transition: transform 0.1s, background 0.15s;
  }
  .btn:hover { background: var(--accent-2); }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: transparent; color: var(--fg-1); border: 1px solid var(--bg-3); }
  .btn.ghost:hover { color: var(--fg-0); border-color: var(--accent); }
  .btn.small { padding: 6px 12px; font-size: 12px; }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: var(--bg-1); border: 1px solid var(--bg-2);
    border-radius: var(--radius); padding: 14px; cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    position: relative; overflow: hidden;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: 10px; margin-bottom: 10px; background: var(--bg-2);
  }
  .card .title { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 4px;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .artist { font-size: 12px; color: var(--fg-2); }
  .card .actions { display: flex; gap: 6px; margin-top: 10px; }
  .card .actions button { flex: 1; }
  .fav-btn { position: absolute; top: 8px; right: 8px;
             background: rgba(0,0,0,0.5); border: none; color: white;
             width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }
  .fav-btn.active { color: gold; }

  .episodes { background: var(--bg-1); border-radius: var(--radius); padding: 16px; margin-top: 20px; }
  .episodes h3 { margin: 0 0 12px; font-size: 16px; }
  .episode {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    transition: background 0.1s;
  }
  .episode:hover { background: var(--bg-2); }
  .episode .meta { flex: 1; min-width: 0; }
  .episode .ep-title { font-size: 14px; font-weight: 500; margin-bottom: 2px;
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .episode .ep-date { font-size: 12px; color: var(--fg-2); }
  .episode .play-icon { font-size: 18px; color: var(--accent); margin-left: 12px; }

  .empty {
    text-align: center; color: var(--fg-2); padding: 60px 20px; font-size: 14px;
  }
  .loading { text-align: center; color: var(--fg-1); padding: 30px; font-size: 14px; }
  .loading::after {
    content: ''; display: inline-block; width: 14px; height: 14px; margin-left: 10px;
    border: 2px solid var(--fg-2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    background: rgba(255,138,154,0.1); color: var(--danger);
    border: 1px solid rgba(255,138,154,0.3);
    padding: 12px 16px; border-radius: var(--radius); margin: 10px 0; font-size: 13px;
  }

  /* Player + effect studio fixed bottom */
  .player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(20,20,43,0.95), rgba(10,10,26,0.98));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--bg-3); box-shadow: var(--shadow);
    padding: 16px 20px 18px;
    transform: translateY(100%); transition: transform 0.3s;
    z-index: 50;
  }
  .player.visible { transform: translateY(0); }
  .player-inner { max-width: 980px; margin: 0 auto; }
  .player-top { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .player-art { width: 56px; height: 56px; border-radius: 10px; background: var(--bg-2); flex-shrink: 0; object-fit: cover; }
  .player-info { flex: 1; min-width: 0; }
  .player-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-pod { font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-controls { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: transparent; border: none; color: var(--fg-0);
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--bg-2); }
  .icon-btn.play { background: var(--accent); width: 44px; height: 44px; }
  .icon-btn.play:hover { background: var(--accent-2); }

  .progress-row { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--fg-2); }
  .progress { flex: 1; height: 4px; background: var(--bg-2); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.15s linear; }

  .player-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .player-actions label { font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; }
  .player-actions input[type="range"] { width: 100px; }
  .toggle-studio {
    background: var(--bg-2); color: var(--fg-0); border: 1px solid var(--bg-3);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 12px;
  }
  .toggle-studio.active { background: var(--accent); border-color: var(--accent); }

  /* Effect studio panel */
  .studio {
    position: fixed; bottom: 0; left: 0; right: 0; max-height: 70vh;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    border-top: 1px solid var(--bg-3); box-shadow: 0 -20px 40px rgba(0,0,0,0.5);
    transform: translateY(100%); transition: transform 0.3s;
    z-index: 60; overflow-y: auto;
  }
  .studio.visible { transform: translateY(0); }
  .studio-inner { max-width: 980px; margin: 0 auto; padding: 20px; }
  .studio-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .studio-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .effect-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .effect-card {
    background: var(--bg-2); border: 1px solid var(--bg-3);
    border-radius: var(--radius); padding: 14px;
    transition: border-color 0.15s;
  }
  .effect-card.on { border-color: var(--accent); background: rgba(138,125,255,0.08); }
  .effect-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .effect-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .effect-emoji { font-size: 18px; }
  .switch {
    width: 40px; height: 22px; background: var(--bg-3); border-radius: 999px;
    position: relative; cursor: pointer; transition: background 0.15s; border: none; padding: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; background: white; border-radius: 50%;
    transition: left 0.15s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 20px; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--fg-2); }
  .slider-row .label { width: 60px; }
  .slider-row input[type="range"] { flex: 1; }

  .timer-row {
    display: flex; align-items: center; gap: 10px; padding: 14px;
    background: var(--bg-2); border-radius: var(--radius); margin-top: 16px;
  }
  .timer-row .label { font-size: 13px; color: var(--fg-1); margin-right: auto; }
  .timer-btn {
    background: var(--bg-3); color: var(--fg-1); border: none;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12px;
  }
  .timer-btn.active { background: var(--accent); color: white; }
  .timer-status { font-size: 12px; color: var(--accent-2); margin-left: 10px; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 4px;
    background: var(--bg-3); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer; border: none;
  }

  .hint { font-size: 12px; color: var(--fg-2); margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="moon">🌙</span> Dreamcast</div>
    <nav class="tabs">
      <button id="tab-search" class="active">Søk</button>
      <button id="tab-favs">⭐ Favoritter</button>
    </nav>
  </header>

  <section id="view-search" class="view active">
    <div class="search-box">
      <input id="q" type="search" placeholder="Søk podcaster — f.eks. «sleep stories», «meditasjon», «historie»" autocomplete="off" />
      <button id="search-btn" class="btn">Søk</button>
    </div>
    <div id="search-results"></div>
  </section>

  <section id="view-favs" class="view">
    <div id="favs-list"></div>
  </section>

  <div id="episodes-container"></div>
</div>

<div id="player" class="player">
  <div class="player-inner">
    <div class="player-top">
      <img id="p-art" class="player-art" alt="" />
      <div class="player-info">
        <div id="p-title" class="player-title">—</div>
        <div id="p-pod" class="player-pod">—</div>
      </div>
      <div class="player-controls">
        <button id="p-back" class="icon-btn" title="Tilbake 15s">⏪</button>
        <button id="p-play" class="icon-btn play" title="Spill/pause">▶</button>
        <button id="p-fwd" class="icon-btn" title="Fram 15s">⏩</button>
      </div>
    </div>
    <div class="progress-row">
      <span id="p-cur">0:00</span>
      <div id="p-progress" class="progress"><div id="p-fill" class="progress-fill"></div></div>
      <span id="p-dur">0:00</span>
    </div>
    <div class="player-actions">
      <label>🔊 Podcast <input id="p-vol" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
      <button id="studio-toggle" class="toggle-studio">🎚 Effekt-studio</button>
    </div>
  </div>
</div>

<div id="studio" class="studio">
  <div class="studio-inner">
    <div class="studio-header">
      <h2>🎚 Effekt-studio</h2>
      <button id="studio-close" class="btn ghost small">Lukk</button>
    </div>
    <div id="effects" class="effect-grid"></div>
    <div class="timer-row">
      <div class="label">💤 Sleep-timer (fader ut over 30s)</div>
      <button class="timer-btn" data-min="15">15 min</button>
      <button class="timer-btn" data-min="30">30 min</button>
      <button class="timer-btn" data-min="45">45 min</button>
      <button class="timer-btn" data-min="60">60 min</button>
      <button class="timer-btn" data-min="0" id="timer-off">Av</button>
      <span id="timer-status" class="timer-status"></span>
    </div>
    <div class="hint">Tips: Reduser podcast-volum og skru opp effektene gradvis til lyden av f.eks. regn dekker stemmen lett — perfekt for å sovne til.</div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ----------------------------------------------------------
   Dreamcast — POC podcast player med Web Audio-effekter
   ---------------------------------------------------------- */

// ---- iTunes Search + RSS ----
// Flere CORS-proxyer prøves i rekkefølge — alle gratis offentlige tjenester
// som har en tendens til å være ustabile. Den første som svarer brukes.
const CORS_PROXIES = [
  (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  (u) => `https://cors.eu.org/${u}`,
  (u) => `https://proxy.cors.sh/${u}`,
];

async function searchPodcasts(term) {
  const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=podcast&limit=24`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Søk feilet (" + res.status + ")");
  const data = await res.json();
  return data.results.map(r => ({
    id: r.collectionId,
    name: r.collectionName,
    artist: r.artistName,
    art: r.artworkUrl600 || r.artworkUrl100,
    feedUrl: r.feedUrl,
  })).filter(p => p.feedUrl);
}

async function fetchViaProxies(url, onProgress) {
  const errors = [];
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    const proxyUrl = CORS_PROXIES[i](url);
    onProgress?.(i + 1, CORS_PROXIES.length);
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(proxyUrl, { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) { errors.push(`proxy ${i+1}: HTTP ${res.status}`); continue; }
      const text = await res.text();
      if (!text || text.length < 50) { errors.push(`proxy ${i+1}: tomt svar`); continue; }
      return text;
    } catch (e) {
      errors.push(`proxy ${i+1}: ${e.name === "AbortError" ? "timeout" : e.message}`);
    }
  }
  throw new Error("Alle CORS-proxyer feilet:\n" + errors.join("\n"));
}

async function fetchFeed(feedUrl, onProgress) {
  const text = await fetchViaProxies(feedUrl, onProgress);
  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "application/xml");
  if (xml.querySelector("parsererror")) {
    throw new Error("RSS-feed kunne ikke parses (kan være HTML eller skadet)");
  }
  const items = Array.from(xml.querySelectorAll("item")).slice(0, 40);
  if (!items.length) throw new Error("RSS-feed inneholder ingen episoder");
  return items.map(item => {
    const enc = item.querySelector("enclosure");
    const url = enc ? enc.getAttribute("url") : null;
    return {
      title: item.querySelector("title")?.textContent?.trim() || "Episode",
      pubDate: item.querySelector("pubDate")?.textContent?.trim() || "",
      audioUrl: url,
    };
  }).filter(e => e.audioUrl);
}

// ---- Favorites (localStorage) ----
const FAVS_KEY = "dreamcast.favs.v1";
function loadFavs() {
  try { return JSON.parse(localStorage.getItem(FAVS_KEY) || "[]"); }
  catch { return []; }
}
function saveFavs(favs) { localStorage.setItem(FAVS_KEY, JSON.stringify(favs)); }
function isFav(id) { return loadFavs().some(f => f.id === id); }
function toggleFav(pod) {
  const favs = loadFavs();
  const idx = favs.findIndex(f => f.id === pod.id);
  if (idx >= 0) favs.splice(idx, 1); else favs.push(pod);
  saveFavs(favs);
}

// ---- UI: tabs ----
const tabSearch = document.getElementById("tab-search");
const tabFavs = document.getElementById("tab-favs");
const viewSearch = document.getElementById("view-search");
const viewFavs = document.getElementById("view-favs");
tabSearch.addEventListener("click", () => switchTab("search"));
tabFavs.addEventListener("click", () => switchTab("favs"));
function switchTab(t) {
  tabSearch.classList.toggle("active", t === "search");
  tabFavs.classList.toggle("active", t === "favs");
  viewSearch.classList.toggle("active", t === "search");
  viewFavs.classList.toggle("active", t === "favs");
  if (t === "favs") renderFavs();
}

// ---- Render: podcast cards ----
function podCard(pod) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <button class="fav-btn ${isFav(pod.id) ? "active" : ""}" title="Lagre som favoritt">★</button>
    <img src="${pod.art}" alt="" loading="lazy" />
    <div class="title">${escapeHtml(pod.name)}</div>
    <div class="artist">${escapeHtml(pod.artist)}</div>
    <div class="actions">
      <button class="btn small open-btn">Åpne</button>
    </div>
  `;
  card.querySelector(".fav-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleFav(pod);
    e.currentTarget.classList.toggle("active");
    if (viewFavs.classList.contains("active")) renderFavs();
  });
  card.querySelector(".open-btn").addEventListener("click", () => openPodcast(pod));
  card.addEventListener("click", () => openPodcast(pod));
  return card;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

// ---- Search view ----
const qInput = document.getElementById("q");
const searchBtn = document.getElementById("search-btn");
const resultsEl = document.getElementById("search-results");
searchBtn.addEventListener("click", doSearch);
qInput.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

async function doSearch() {
  const q = qInput.value.trim();
  if (!q) return;
  resultsEl.innerHTML = `<div class="loading">Søker…</div>`;
  try {
    const pods = await searchPodcasts(q);
    if (!pods.length) { resultsEl.innerHTML = `<div class="empty">Ingen treff.</div>`; return; }
    const grid = document.createElement("div");
    grid.className = "grid";
    pods.forEach(p => grid.appendChild(podCard(p)));
    resultsEl.innerHTML = "";
    resultsEl.appendChild(grid);
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

// ---- Favorites view ----
function renderFavs() {
  const favs = loadFavs();
  if (!favs.length) {
    viewFavs.innerHTML = `<div class="empty">Ingen favoritter ennå. Søk og trykk ★ på en podcast.</div>`;
    return;
  }
  viewFavs.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "grid";
  favs.forEach(p => grid.appendChild(podCard(p)));
  viewFavs.appendChild(grid);
}

// ---- Episodes ----
const episodesContainer = document.getElementById("episodes-container");
async function openPodcast(pod) {
  episodesContainer.innerHTML = `
    <div class="episodes">
      <h3>Henter episoder for «${escapeHtml(pod.name)}»…</h3>
      <div class="loading" id="proxy-status">Kobler til</div>
    </div>`;
  episodesContainer.scrollIntoView({ behavior: "smooth", block: "start" });
  const statusEl = document.getElementById("proxy-status");
  try {
    const episodes = await fetchFeed(pod.feedUrl, (i, total) => {
      if (statusEl) statusEl.textContent = `Prøver proxy ${i}/${total}`;
    });
    const box = document.createElement("div");
    box.className = "episodes";
    box.innerHTML = `<h3>${escapeHtml(pod.name)} — ${episodes.length} episoder</h3>`;
    episodes.forEach(ep => {
      const row = document.createElement("div");
      row.className = "episode";
      const date = ep.pubDate ? new Date(ep.pubDate).toLocaleDateString("no-NO", { year: "numeric", month: "short", day: "numeric" }) : "";
      row.innerHTML = `
        <div class="meta">
          <div class="ep-title">${escapeHtml(ep.title)}</div>
          <div class="ep-date">${escapeHtml(date)}</div>
        </div>
        <span class="play-icon">▶</span>
      `;
      row.addEventListener("click", () => playEpisode(pod, ep));
      box.appendChild(row);
    });
    episodesContainer.innerHTML = "";
    episodesContainer.appendChild(box);
  } catch (err) {
    const feedHost = (() => { try { return new URL(pod.feedUrl).host; } catch { return pod.feedUrl; } })();
    episodesContainer.innerHTML = `
      <div class="error">
        <strong>Kunne ikke laste episoder fra ${escapeHtml(feedHost)}.</strong><br>
        <pre style="white-space:pre-wrap; margin:8px 0 0; font-size:11px; color:var(--fg-2);">${escapeHtml(err.message)}</pre>
        <div style="margin-top:8px; font-size:12px;">
          Gratis CORS-proxyer er ustabile. Prøv en annen podcast, eller åpne Konsoll (Cmd+Opt+J / F12) for detaljer.
          Du kan også klikke <a href="${escapeHtml(pod.feedUrl)}" target="_blank" style="color:var(--accent-2);">RSS-feeden</a> for å sjekke at den faktisk svarer.
        </div>
      </div>`;
  }
}

// ---- Player ----
const audio = document.getElementById("audio");
const playerEl = document.getElementById("player");
const pArt = document.getElementById("p-art");
const pTitle = document.getElementById("p-title");
const pPod = document.getElementById("p-pod");
const pPlay = document.getElementById("p-play");
const pBack = document.getElementById("p-back");
const pFwd = document.getElementById("p-fwd");
const pCur = document.getElementById("p-cur");
const pDur = document.getElementById("p-dur");
const pProgress = document.getElementById("p-progress");
const pFill = document.getElementById("p-fill");
const pVol = document.getElementById("p-vol");

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
          : `${m}:${String(sec).padStart(2,"0")}`;
}

let currentEpisode = null;
async function playEpisode(pod, ep) {
  currentEpisode = { pod, ep };
  audio.src = ep.audioUrl;
  pArt.src = pod.art || "";
  pTitle.textContent = ep.title;
  pPod.textContent = pod.name;
  playerEl.classList.add("visible");
  try {
    await ensureAudioContext();
    await audio.play();
  } catch (err) {
    console.error(err);
  }
}

pPlay.addEventListener("click", async () => {
  if (!currentEpisode) return;
  await ensureAudioContext();
  if (audio.paused) audio.play(); else audio.pause();
});
audio.addEventListener("play", () => pPlay.textContent = "⏸");
audio.addEventListener("pause", () => pPlay.textContent = "▶");
audio.addEventListener("loadedmetadata", () => pDur.textContent = fmt(audio.duration));
audio.addEventListener("timeupdate", () => {
  pCur.textContent = fmt(audio.currentTime);
  if (audio.duration) pFill.style.width = (audio.currentTime / audio.duration * 100) + "%";
});
pProgress.addEventListener("click", e => {
  if (!audio.duration) return;
  const rect = pProgress.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});
pBack.addEventListener("click", () => audio.currentTime = Math.max(0, audio.currentTime - 15));
pFwd.addEventListener("click", () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15));
pVol.addEventListener("input", () => audio.volume = parseFloat(pVol.value));
audio.volume = parseFloat(pVol.value);

// ---- Web Audio: effects ----
let audioCtx = null;
let masterGain = null;
async function ensureAudioContext() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") await audioCtx.resume();
    return audioCtx;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1.0;
  masterGain.connect(audioCtx.destination);
  return audioCtx;
}

// Noise buffer generators (cached)
const noiseCache = {};
function makeNoiseBuffer(type, seconds = 4) {
  const key = `${type}-${seconds}`;
  if (noiseCache[key]) return noiseCache[key];
  const sr = audioCtx.sampleRate;
  const len = sr * seconds;
  const buf = audioCtx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  if (type === "white") {
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } else if (type === "pink") {
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < len; i++) {
      const w = Math.random()*2-1;
      b0 = 0.99886*b0 + w*0.0555179;
      b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522;
      b5 = -0.7616*b5 - w*0.0168980;
      d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
      b6 = w*0.115926;
    }
  } else if (type === "brown") {
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random()*2-1;
      last = (last + 0.02*w) / 1.02;
      d[i] = last * 3.5;
    }
  }
  noiseCache[key] = buf;
  return buf;
}

/*
   Each effect builds a small Web Audio graph hanging off masterGain.
   - start(): build nodes, schedule loops/randoms, ramp gain in
   - stop():  ramp gain out, disconnect, clear scheduled jobs
   - setVolume(v)  : 0..1
   - setIntensity(i): 0..1 — meaning depends on the effect
*/

class Effect {
  constructor() {
    this.running = false;
    this.volume = 0.5;
    this.intensity = 0.5;
    this.scheduled = [];
  }
  schedule(fn, t) { const id = setTimeout(fn, t); this.scheduled.push(id); return id; }
  clearScheduled() { this.scheduled.forEach(clearTimeout); this.scheduled = []; }
  setVolume(v) {
    this.volume = v;
    if (this.gain && this.running) {
      this.gain.gain.cancelScheduledValues(audioCtx.currentTime);
      this.gain.gain.linearRampToValueAtTime(v, audioCtx.currentTime + 0.1);
    }
  }
  setIntensity(i) { this.intensity = i; this.applyIntensity?.(); }
  start() {
    if (this.running) return;
    this.running = true;
    this.gain = audioCtx.createGain();
    this.gain.gain.value = 0;
    this.gain.connect(masterGain);
    this.build();
    this.gain.gain.linearRampToValueAtTime(this.volume, audioCtx.currentTime + 0.4);
  }
  stop() {
    if (!this.running) return;
    this.running = false;
    this.clearScheduled();
    this.gain.gain.cancelScheduledValues(audioCtx.currentTime);
    this.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
    const g = this.gain, nodes = this.nodes || [];
    setTimeout(() => {
      try { g.disconnect(); } catch {}
      nodes.forEach(n => { try { n.stop && n.stop(); } catch {} try { n.disconnect(); } catch {} });
    }, 400);
    this.nodes = [];
  }
  build() { /* override */ }
  applyIntensity() { /* override */ }
}

class RainEffect extends Effect {
  build() {
    this.nodes = [];
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer("brown", 6);
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 1200 + this.intensity * 2800;
    const hp = audioCtx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 200;
    src.connect(hp); hp.connect(lp); lp.connect(this.gain);
    src.start();
    this.nodes.push(src, hp, lp);
    this.lp = lp;
    this.scheduleDroplet();
  }
  scheduleDroplet() {
    if (!this.running) return;
    const delay = 30 + Math.random() * (300 - this.intensity*250);
    this.schedule(() => {
      if (!this.running) return;
      this.makeDroplet();
      this.scheduleDroplet();
    }, delay);
  }
  makeDroplet() {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.value = 2000 + Math.random() * 4000;
    g.gain.value = 0;
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.04 + this.intensity*0.05, now + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
    osc.connect(g); g.connect(this.gain);
    osc.start(now); osc.stop(now + 0.06);
  }
  applyIntensity() { if (this.lp) this.lp.frequency.value = 1200 + this.intensity * 2800; }
}

class OceanEffect extends Effect {
  build() {
    this.nodes = [];
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer("brown", 8);
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 600 + this.intensity * 1200;
    // LFO on a gain node to simulate waves
    const waveGain = audioCtx.createGain();
    waveGain.gain.value = 0.4;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.12 + this.intensity * 0.15;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.35;
    lfo.connect(lfoGain); lfoGain.connect(waveGain.gain);
    src.connect(lp); lp.connect(waveGain); waveGain.connect(this.gain);
    src.start(); lfo.start();
    this.nodes.push(src, lp, waveGain, lfo, lfoGain);
    this.lp = lp; this.lfo = lfo;
  }
  applyIntensity() {
    if (this.lp) this.lp.frequency.value = 600 + this.intensity * 1200;
    if (this.lfo) this.lfo.frequency.value = 0.12 + this.intensity * 0.15;
  }
}

class WindEffect extends Effect {
  build() {
    this.nodes = [];
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer("pink", 6);
    src.loop = true;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 500;
    bp.Q.value = 0.6;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.1 + this.intensity * 0.25;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 300 + this.intensity * 800;
    lfo.connect(lfoGain); lfoGain.connect(bp.frequency);
    src.connect(bp); bp.connect(this.gain);
    src.start(); lfo.start();
    this.nodes.push(src, bp, lfo, lfoGain);
    this.lfo = lfo; this.lfoGain = lfoGain;
  }
  applyIntensity() {
    if (this.lfo) this.lfo.frequency.value = 0.1 + this.intensity * 0.25;
    if (this.lfoGain) this.lfoGain.gain.value = 300 + this.intensity * 800;
  }
}

class StreamEffect extends Effect {
  build() {
    this.nodes = [];
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer("white", 5);
    src.loop = true;
    const hp = audioCtx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 800;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 5000;
    const base = audioCtx.createGain();
    base.gain.value = 0.3;
    src.connect(hp); hp.connect(lp); lp.connect(base); base.connect(this.gain);
    src.start();
    this.nodes.push(src, hp, lp, base);
    this.scheduleBubble();
  }
  scheduleBubble() {
    if (!this.running) return;
    const delay = 80 + Math.random() * (400 - this.intensity*300);
    this.schedule(() => {
      if (!this.running) return;
      this.makeBubble();
      this.scheduleBubble();
    }, delay);
  }
  makeBubble() {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(400 + Math.random()*400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800 + Math.random()*400, audioCtx.currentTime + 0.08);
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.05 + this.intensity*0.05, audioCtx.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
    osc.connect(g); g.connect(this.gain);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }
}

class FireplaceEffect extends Effect {
  build() {
    this.nodes = [];
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer("pink", 5);
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 400 + this.intensity * 600;
    src.connect(lp); lp.connect(this.gain);
    src.start();
    this.nodes.push(src, lp);
    this.lp = lp;
    this.scheduleCrackle();
  }
  scheduleCrackle() {
    if (!this.running) return;
    const delay = 100 + Math.random() * (800 - this.intensity*600);
    this.schedule(() => {
      if (!this.running) return;
      this.makeCrackle();
      this.scheduleCrackle();
    }, delay);
  }
  makeCrackle() {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.exp(-i / (d.length*0.15));
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1500 + Math.random()*2000;
    bp.Q.value = 1.5;
    const g = audioCtx.createGain();
    g.gain.value = 0.1 + this.intensity*0.15;
    src.connect(bp); bp.connect(g); g.connect(this.gain);
    src.start();
  }
  applyIntensity() { if (this.lp) this.lp.frequency.value = 400 + this.intensity * 600; }
}

class FanEffect extends Effect {
  build() {
    this.nodes = [];
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer("brown", 6);
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 1500 + this.intensity * 1500;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.5 + this.intensity * 2;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.08;
    const offset = audioCtx.createGain();
    offset.gain.value = 0.92;
    lfo.connect(lfoGain);
    const mod = audioCtx.createGain();
    lfoGain.connect(mod.gain);
    offset.connect(mod.gain);
    src.connect(lp); lp.connect(mod); mod.connect(this.gain);
    src.start(); lfo.start();
    this.nodes.push(src, lp, lfo, lfoGain, offset, mod);
    this.lp = lp; this.lfo = lfo;
  }
  applyIntensity() {
    if (this.lp) this.lp.frequency.value = 1500 + this.intensity * 1500;
    if (this.lfo) this.lfo.frequency.value = 0.5 + this.intensity * 2;
  }
}

// Effect registry
const EFFECTS = [
  { key: "rain",   name: "Regn",     emoji: "🌧",  cls: RainEffect },
  { key: "ocean",  name: "Hav/bølger", emoji: "🌊", cls: OceanEffect },
  { key: "wind",   name: "Vind",     emoji: "🍃",  cls: WindEffect },
  { key: "stream", name: "Bekk",     emoji: "💧",  cls: StreamEffect },
  { key: "fire",   name: "Peis/bål", emoji: "🔥",  cls: FireplaceEffect },
  { key: "fan",    name: "Vifte",    emoji: "🌬",  cls: FanEffect },
];
const effectInstances = {};

function buildEffectStudioUI() {
  const wrap = document.getElementById("effects");
  wrap.innerHTML = "";
  EFFECTS.forEach(e => {
    const inst = new e.cls();
    effectInstances[e.key] = inst;
    const card = document.createElement("div");
    card.className = "effect-card";
    card.dataset.key = e.key;
    card.innerHTML = `
      <div class="effect-head">
        <div class="effect-name"><span class="effect-emoji">${e.emoji}</span> ${e.name}</div>
        <button class="switch" data-on="0" aria-label="${e.name} on/off"></button>
      </div>
      <div class="slider-row">
        <span class="label">Volum</span>
        <input type="range" class="vol" min="0" max="1" step="0.01" value="0.5" />
      </div>
      <div class="slider-row">
        <span class="label">Intensitet</span>
        <input type="range" class="int" min="0" max="1" step="0.01" value="0.5" />
      </div>
    `;
    const sw = card.querySelector(".switch");
    const vol = card.querySelector(".vol");
    const intn = card.querySelector(".int");
    sw.addEventListener("click", async () => {
      await ensureAudioContext();
      const on = sw.classList.toggle("on");
      card.classList.toggle("on", on);
      inst.setVolume(parseFloat(vol.value));
      inst.setIntensity(parseFloat(intn.value));
      if (on) inst.start(); else inst.stop();
    });
    vol.addEventListener("input", () => inst.setVolume(parseFloat(vol.value)));
    intn.addEventListener("input", () => inst.setIntensity(parseFloat(intn.value)));
    wrap.appendChild(card);
  });
}

// ---- Sleep timer with fade ----
let sleepTimer = null;
let fadeTimer = null;
const timerStatusEl = document.getElementById("timer-status");
document.querySelectorAll(".timer-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".timer-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const min = parseInt(btn.dataset.min, 10);
    setSleepTimer(min);
  });
});

function setSleepTimer(minutes) {
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
  if (audioCtx && masterGain) {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
  }
  if (minutes === 0) {
    timerStatusEl.textContent = "";
    audio.volume = parseFloat(pVol.value);
    return;
  }
  const endsAt = Date.now() + minutes * 60 * 1000;
  const updateLabel = () => {
    const left = endsAt - Date.now();
    if (left <= 0) { timerStatusEl.textContent = ""; return; }
    const m = Math.floor(left / 60000), s = Math.floor((left % 60000)/1000);
    timerStatusEl.textContent = `${m}:${String(s).padStart(2,"0")} igjen`;
    if (sleepTimer) fadeTimer = setTimeout(updateLabel, 1000);
  };
  updateLabel();
  sleepTimer = setTimeout(() => beginFadeOut(), Math.max(0, minutes * 60 * 1000 - 30000));
}

function beginFadeOut() {
  timerStatusEl.textContent = "fader ut…";
  const startVol = audio.volume;
  const startTime = Date.now();
  const dur = 30000;
  if (audioCtx && masterGain) {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 30);
  }
  const step = () => {
    const t = (Date.now() - startTime) / dur;
    if (t >= 1) {
      audio.volume = 0;
      audio.pause();
      Object.values(effectInstances).forEach(e => e.stop());
      document.querySelectorAll(".effect-card.on .switch.on").forEach(s => s.classList.remove("on"));
      document.querySelectorAll(".effect-card.on").forEach(c => c.classList.remove("on"));
      timerStatusEl.textContent = "💤 god natt";
      audio.volume = startVol; // restore for next time
      return;
    }
    audio.volume = startVol * (1 - t);
    setTimeout(step, 100);
  };
  step();
}
